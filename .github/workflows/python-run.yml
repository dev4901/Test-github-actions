name: Add Label to GCE Instance

on:
  push:
    branches:
      - python-test
    paths:
      - '../python-test.py'

jobs:
  add-label:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write" # Needed for WIF

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1065920978070/locations/global/workloadIdentityPools/github-actions-pools/providers/github-actions-test"
          service_account: "github-actions-tf@cellular-motif-457805-t1.iam.gserviceaccount.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python3 python_test.py
